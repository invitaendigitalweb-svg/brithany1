<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis 15 Años</title>

    <!-- Etiquetas Open Graph para la miniatura de WhatsApp -->
    <meta property="og:title" content="Mis 15 Años">
    <meta property="og:description" content="Te invito a celebrar este momento tan especial conmigo. Haz click para abrir tu invitación.">
    <meta property="og:image" content="portada.jpg">
    <meta property="og:url" content="">
    <meta property="og:type" content="https://invitaendigitalweb-svg.github.io/xvbrithany">

    <link rel="preconnect" href="https://fonts.cdnfonts.com">
    <link href="https://fonts.cdnfonts.com/css/ss-abigail" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #e8e2d8;
            font-family: 'SS Abigail', serif;
        }

        /* Pantalla de bienvenida / Sobre inicial */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f9f6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1s ease, visibility 1s ease;
            cursor: pointer;
        }

        #welcome-screen img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }

        /* Contenedor principal estilo tarjeta móvil centrada */
        .invitation-wrapper {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background-color: #f9f6f0;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.15);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #main-content {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-img {
            width: 100%;
            background-color: #f9f6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 0;
            font-size: 0;
        }

        .section-img img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Animación de entrada con zoom elegante */
        .animate-zoom {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1.2s ease-out, transform 1.2s ease-out;
        }

        .animate-zoom.active {
            opacity: 1;
            transform: scale(1);
        }

        /* Animación especial flotante/deslizante para vestimenta y regalos */
        .animate-float {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1.2s ease-out, transform 1.2s ease-out;
        }

        .animate-float.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Animación padrisima especial (Flip 3D con destello) para la sección de Asistencia */
        .animate-flip-special {
            opacity: 0;
            transform: perspective(1000px) rotateX(25deg) scale(0.85);
            filter: brightness(1.2);
            transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1), transform 1.4s cubic-bezier(0.16, 1, 0.3, 1), filter 1.4s ease;
        }

        .animate-flip-special.active {
            opacity: 1;
            transform: perspective(1000px) rotateX(0deg) scale(1);
            filter: brightness(1);
        }

        /* Sección de la cuenta regresiva en fondo blanco */
        .countdown-section {
            width: 100%;
            padding: 40px 20px 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
        }

        .countdown {
            display: flex;
            gap: 35px;
            align-items: flex-end;
            justify-content: center;
        }

        .block {
            text-align: center;
            position: relative;
        }

        .number {
            font-size: 50px;
            color: #BB9885;
            line-height: 1;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(187, 152, 133, 0.25);
        }

        .block::after {
            content: "";
            display: block;
            width: 32px;
            height: 1px;
            background: rgba(187, 152, 133, 0.4);
            margin: 8px auto 6px;
        }

        .label {
            font-size: 11px;
            letter-spacing: 3px;
            color: #A37E6B;
        }

        /* Sección de Ceremonia y Ubicación */
        .location-section {
            width: 100%;
            background-color: #F9EEEB;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 45px 20px;
        }

        .location-section img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Sección de Recepción */
        .reception-section {
            width: 100%;
            background-color: #F9EEEB;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 45px 20px;
        }

        .reception-section img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Sección de la imagen de título de galería */
        .gallery-title-section {
            width: 100%;
            background-color: #f9f6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 0;
            font-size: 0;
        }

        .gallery-title-section img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Sección del Carrusel con altura extendida */
        .gallery-section {
            width: 100%;
            background-color: #f9f6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 0;
            font-size: 0;
            padding: 0;
            margin: 0;
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 600px; 
            overflow: hidden;
            background: #f9f6f0;
        }

        .slider-container img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        .slider-container img.active {
            opacity: 1;
        }

        /* Botón personalizado de ubicación */
        .location-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            background-color: #E5A6AC;
            color: #ffffff;
            font-family: 'SS Abigail', serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(229, 166, 172, 0.3);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .location-btn:hover {
            transform: scale(1.05);
            background-color: #d8959b;
        }

        /* Estilos específicos para el Formulario de Asistencia Integrado */
        #rsvp-section-wrapper {
            width: 100%;
            background-color: #f9f6f0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .container-rsvp {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            color: #333333;
        }

        .container-rsvp h2 {
            margin-bottom: 20px;
            color: #BB9885;
            font-family: 'SS Abigail', serif;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .container-rsvp .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .container-rsvp label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 13px;
            color: #555555;
        }

        .container-rsvp input[type="text"], 
        .container-rsvp textarea, 
        .container-rsvp select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            background-color: #faf9f6;
        }

        .container-rsvp textarea {
            resize: vertical;
            height: 75px;
        }

        .btn-rsvp {
            background-color: #E5A6AC;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            font-family: 'SS Abigail', serif;
            font-weight: 700;
            letter-spacing: 1px;
            transition: background 0.3s;
        }

        .btn-rsvp:hover {
            background-color: #d8959b;
        }

        .pass-container img {
            max-width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #E5A6AC;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Control de Música */
        #music-control {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            background-color: #ffd1dc;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            z-index: 100;
            border: 2px solid #ffffff;
            transition: transform 0.3s ease;
        }

        #music-control:hover {
            transform: scale(1.1);
        }

        #music-control svg {
            width: 24px;
            height: 24px;
            fill: #555555;
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            display: none !important;
        }

        @media(max-width: 480px) {
            .invitation-wrapper {
                max-width: 100%;
                box-shadow: none;
            }
            .countdown { gap: 20px; }
            .number { font-size: 42px; }
            .label { font-size: 10px; }
            .slider-container { height: 520px; }
        }
    </style>
</head>
<body>

    <!-- Pantalla de Bienvenida -->
    <div id="welcome-screen" title="Haz clic para abrir">
        <img src="foto.jpg" alt="Sobre de invitación">
    </div>

    <!-- Contenedor general en formato tarjeta estilo celular -->
    <div class="invitation-wrapper">
        <!-- Contenido Principal -->
        <div id="main-content">
            <!-- 1. Foto de Portada -->
            <section class="section-img">
                <img src="portada.jpg" alt="Portada de la invitación de Mis 15 Años">
            </section>

            <!-- 2. Foto de Frase -->
            <section class="section-img">
                <img src="frase.jpg" alt="Frase de Mis 15 Años" class="animate-zoom">
            </section>

            <!-- 3. Foto de Fecha -->
            <section class="section-img">
                <img src="fecha.jpg" alt="Fecha de Mis 15 Años" class="animate-zoom">
            </section>

            <!-- 4. Cuenta Regresiva -->
            <section class="countdown-section">
                <div class="countdown">
                    <div class="block">
                        <div id="days" class="number">0</div>
                        <div class="label">DÍAS</div>
                    </div>
                    <div class="block">
                        <div id="hours" class="number">00</div>
                        <div class="label">HORAS</div>
                    </div>
                    <div class="block">
                        <div id="minutes" class="number">00</div>
                        <div class="label">MINUTOS</div>
                    </div>
                    <div class="block">
                        <div id="seconds" class="number">00</div>
                        <div class="label">SEGUNDOS</div>
                    </div>
                </div>
            </section>

            <!-- 5. Foto de Ceremonia y Ubicación -->
            <section class="location-section">
                <img src="ceremonia.jpg" alt="Detalles de ceremonia" class="animate-zoom">
                <a href="https://www.google.com/maps/place/Parroquia+del+Sagrado+Coraz%C3%B3n+de+Jes%C3%BAs/@28.6262123,-106.0734464,859m/data=!3m2!1e3!4b1!4m6!3m5!1s0x86ea5caebcfb39a9:0x7142c0ef10e82b9b!8m2!3d28.6262123!4d-106.0711241!16s%2Fg%2F1tgdcw5w!18m1!1e1?entry=ttu&g_ep=EgoyMDI2MDcyOS4wIKXMDSoASAFQAw%3D%3D" target="_blank" class="location-btn">VER UBICACIÓN</a>
            </section>

            <!-- 6. Foto de Recepción y Ubicación -->
            <section class="reception-section">
                <img src="recepcion.jpg" alt="Detalles de recepción" class="animate-zoom">
                <a href="https://www.google.com/maps/place/Quinta+kiri,+C.+Guadalupe+Posadas,+11+de+Febrero+Sur,+31066+Chihuahua,+Chih./data=!4m2!3m1!1s0x86ea5bac27293f75:0x64a47b49dd5ce364!18m1!1e1?utm_source=mstt_1&entry=gps&coh=192189&g_ep=CAESBzI2LjI5LjIYACCenQoqnwEsOTQyNjc3MjcsOTQyOTIxOTUsOTQyOTk1MzIsMTAwNzk2NDk4LDEwMDc5Nzc2MSwxMDA3OTY1MzUsOTQyODA1NzYsOTQyMDczOTQsOTQyMDc1MDYsOTQyMDg1MDYsOTQyMTg2NTMsOTQyMjk4MzksOTQyNzUxNjgsOTQyNzk2MTksMTAwODE1NjM1LDEwMDgyMDIzNywxMDA4MjI0ODlCAk1Y&skid=04858c28-c6d2-4605-bc97-a16742ce76be&g_st=aw" target="_blank" class="location-btn">VER UBICACIÓN</a>
            </section>

            <!-- 7. Foto Título de Galería -->
            <section class="gallery-title-section">
                <img src="galeria.jpg" alt="Galería de Mis 15 Años" class="animate-zoom">
            </section>

            <!-- 8. Carrusel de Fotos -->
            <section class="gallery-section">
                <div class="slider-container animate-zoom">
                    <img src="https://i.imgur.com/MSYBfYT.jpeg" class="active" alt="Foto 1">
                    <img src="https://i.imgur.com/OwS4Q50.png" alt="Foto 2">
                    <img src="https://i.imgur.com/L67IlOh.jpeg" alt="Foto 3">
                </div>
            </section>

            <!-- 9. Foto de Vestimenta -->
            <section class="section-img">
                <img src="vestimenta.jpg" alt="Código de vestimenta" class="animate-float">
            </section>

            <!-- 10. Foto de Regalo -->
            <section class="section-img">
                <img src="regalo.jpg" alt="Sugerencia de regalo" class="animate-float">
            </section>

            <!-- 11. Sección de Asistencia con la imagen superior y formulario interactivo abajo -->
            <section class="section-img" style="flex-direction: column;">
                <img src="asistencia.jpg" alt="Confirmar asistencia" class="animate-flip-special" style="margin-bottom: 0;">
            </section>

            <div id="rsvp-section-wrapper" class="animate-flip-special">
                <div class="container-rsvp">
                    <!-- Pantalla de Carga Inicial -->
                    <div id="loading-screen">
                        <div class="loader"></div>
                        <p style="font-size: 13px; color: #666;">Verificando estado de invitación...</p>
                    </div>

                    <!-- Formulario de Confirmación -->
                    <form id="rsvp-form" class="hidden">
                        <h2>Confirmación de Asistencia</h2>
                        
                        <div class="form-group">
                            <label for="nombre">Nombre y Apellido *</label>
                            <input type="text" id="nombre" name="nombre" required placeholder="Ej. María Pérez">
                        </div>

                        <div class="form-group">
                            <label for="asistencia">¿Asistirás? *</label>
                            <select id="asistencia" name="asistencia" required>
                                <option value="" disabled selected>Selecciona una opción</option>
                                <option value="Sí asisto">Sí, ahí estaré</option>
                                <option value="No asisto">No podré asistir</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="mensaje">Mensaje o felicitación</label>
                            <textarea id="mensaje" name="mensaje" placeholder="Escribe unas palabras..."></textarea>
                        </div>

                        <button type="submit" id="btn-enviar" class="btn-rsvp">Enviar Confirmación</button>
                    </form>

                    <!-- Pantalla de Pase / Ya confirmado -->
                    <div id="success-screen" class="hidden">
                        <h2 id="success-title">¡Gracias por confirmar!</h2>
                        <p id="success-message" style="font-size: 13px; margin-bottom: 15px; line-height: 1.4;">Tu respuesta ha sido registrada con éxito.</p>
                        
                        <div class="pass-container" id="pass-section">
                            <p style="font-size: 13px; margin-bottom: 8px;"><strong>Tu Pase de Entrada:</strong></p>
                            <img src="pase.jpg" alt="Pase de Invitación" id="pase-img">
                            <button id="btn-descargar" class="btn-rsvp">Descargar Pase</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Reproductor de Audio -->
    <audio id="bg-music" loop>
        <source src="cancion.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <!-- Botón flotante de música -->
    <div id="music-control" class="hidden" title="Reproducir / Pausar música">
        <svg id="icon-speaker" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <svg id="icon-pause" viewBox="0 0 24 24" style="display: none;">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
    </div>

    <script>
        const welcomeScreen = document.getElementById('welcome-screen');
        const mainContent = document.getElementById('main-content');
        const bgMusic = document.getElementById('bg-music');
        const musicControl = document.getElementById('music-control');
        const iconSpeaker = document.getElementById('icon-speaker');
        const iconPause = document.getElementById('icon-pause');

        let isPlaying = false;

        welcomeScreen.addEventListener('click', () => {
            welcomeScreen.style.opacity = '0';
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
            }, 1000);

            mainContent.style.visibility = 'visible';
            mainContent.style.opacity = '1';
            musicControl.classList.remove('hidden');

            bgMusic.play().then(() => {
                isPlaying = true;
                updateMusicIcon();
            }).catch(error => {
                console.log("Reproducción automática bloqueada por el navegador:", error);
            });
        });

        musicControl.addEventListener('click', () => {
            if (isPlaying) {
                bgMusic.pause();
                isPlaying = false;
            } else {
                bgMusic.play();
                isPlaying = true;
            }
            updateMusicIcon();
        });

        function updateMusicIcon() {
            if (isPlaying) {
                iconSpeaker.style.display = 'none';
                iconPause.style.display = 'block';
            } else {
                iconSpeaker.style.display = 'block';
                iconPause.style.display = 'none';
            }
        }

        /* Animación de entrada al hacer scroll */
        const observerOptions = {
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.animate-zoom, .animate-float, .animate-flip-special').forEach(el => {
            observer.observe(el);
        });

        /* Script del Carrusel de Fotos */
        const sliderImages = document.querySelectorAll('.slider-container img');
        let currentSlide = 0;

        setInterval(() => {
            sliderImages[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % sliderImages.length;
            sliderImages[currentSlide].classList.add('active');
        }, 3000);

        /* Cuenta Regresiva actualizada al 22 de Agosto de 2026 a las 3:00 PM (15:00 hrs) */
        const DATE_TARGET = new Date(2026, 7, 22, 15, 0, 0);

        const days = document.getElementById('days');
        const hours = document.getElementById('hours');
        const minutes = document.getElementById('minutes');
        const seconds = document.getElementById('seconds');

        const MS = 1000;
        const MIN = MS * 60;
        const H = MIN * 60;
        const D = H * 24;

        function format(n){
            return n < 10 ? '0' + n : n;
        }

        (function updateCountdown(){
            const now = new Date();
            let dur = DATE_TARGET - now;

            if(dur < 0) dur = 0;

            days.textContent = Math.floor(dur / D);
            hours.textContent = format(Math.floor((dur % D) / H));
            minutes.textContent = format(Math.floor((dur % H) / MIN));
            seconds.textContent = format(Math.floor((dur % MIN) / MS));

            setTimeout(updateCountdown, 1000);
        })();

        /* Lógica del Formulario de Asistencia y Google Apps Script */
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx9EowmhWaH1e8MjglJmeXDPROZbzjzic2n7kT0nWrs0RWddwlzPcSQunDB-iBGYayx/exec';

        const loadingScreen = document.getElementById('loading-screen');
        const rsvpForm = document.getElementById('rsvp-form');
        const successScreen = document.getElementById('success-screen');
        const successTitle = document.getElementById('success-title');
        const successMessage = document.getElementById('success-message');
        const passSection = document.getElementById('pass-section');
        const btnDescargar = document.getElementById('btn-descargar');

        window.addEventListener('DOMContentLoaded', () => {
            const localConfirmed = localStorage.getItem('invitacion_confirmada');
            if (localConfirmed) {
                mostrarPantallaExito(JSON.parse(localConfirmed));
            } else {
                loadingScreen.classList.add('hidden');
                rsvpForm.classList.remove('hidden');
            }
        });

        rsvpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnEnviar = document.getElementById('btn-enviar');
            btnEnviar.disabled = true;
            btnEnviar.textContent = 'Procesando...';

            const nombre = document.getElementById('nombre').value.trim();
            const asistencia = document.getElementById('asistencia').value;
            const mensaje = document.getElementById('mensaje').value.trim();

            const datos = {
                nombre: nombre,
                asistencia: asistencia,
                mensaje: mensaje
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(datos)
                });
                const result = await response.json();

                if (result.status === 'duplicado') {
                    alert('Atención: ' + result.message);
                    const userData = { nombre: nombre, asistencia: result.asistencia || asistencia };
                    localStorage.setItem('invitacion_confirmada', JSON.stringify(userData));
                    mostrarPantallaExito(userData);
                } else if (result.status === 'success') {
                    const userData = { nombre: nombre, asistencia: asistencia };
                    localStorage.setItem('invitacion_confirmada', JSON.stringify(userData));
                    mostrarPantallaExito(userData);
                } else {
                    alert('Hubo un error al registrar. Inténtalo de nuevo.');
                    btnEnviar.disabled = false;
                    btnEnviar.textContent = 'Enviar Confirmación';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión con el servidor.');
                btnEnviar.disabled = false;
                btnEnviar.textContent = 'Enviar Confirmación';
            }
        });

        function mostrarPantallaExito(data) {
            loadingScreen.classList.add('hidden');
            rsvpForm.classList.add('hidden');
            successScreen.classList.remove('hidden');

            if (data.asistencia === 'No asisto') {
                successTitle.textContent = 'Gracias por avisarnos';
                successMessage.textContent = `${data.nombre}, lamentamos que no nos acompañes. ¡Gracias por tus buenos deseos!`;
                passSection.classList.add('hidden');
            } else {
                successTitle.textContent = '¡Ya estás confirmado(a)!';
                successMessage.textContent = `${data.nombre}, tu asistencia ha quedado registrada correctamente.`;
                passSection.classList.remove('hidden');
            }
        }

        btnDescargar.addEventListener('click', async () => {
            const imagePath = 'pase.jpg';
            try {
                const response = await fetch(imagePath);
                const blob = await response.blob();
                
                if (navigator.canShare && navigator.canShare({ files: [new File([blob], 'pase.jpg', { type: blob.type })] })) {
                    const file = new File([blob], 'pase_invitacion.jpg', { type: blob.type });
                    await navigator.share({
                        title: 'Tu Pase de Invitación',
                        text: 'Aquí tienes tu pase de acceso.',
                        files: [file]
                    });
                } else {
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = 'pase_invitacion.jpg';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(blobUrl);
                }
            } catch (err) {
                const a = document.createElement('a');
                a.href = imagePath;
                a.download = 'pase_invitacion.jpg';
                a.target = '_blank';
                a.click();
            }
        });
    </script>
</body>
</html>
