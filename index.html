<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis 15 Años</title>

    <!-- Etiquetas Open Graph para la miniatura de WhatsApp -->
    <meta property="og:title" content="Mis 15 Años">
    <meta property="og:description" content="Te invito a celebrar este momento tan especial conmigo. Haz click para abrir tu invitación.">
    <meta property="og:image" content="portada.jpg">
    <meta property="og:url" content="">
    <meta property="og:type" content="https://invitaendigitalweb-svg.github.io/xvbrithany">

    <link rel="preconnect" href="https://fonts.cdnfonts.com">
    <link href="https://fonts.cdnfonts.com/css/ss-abigail" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #e8e2d8;
            font-family: 'SS Abigail', serif;
        }

        /* Pantalla de bienvenida / Sobre inicial */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f9f6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1s ease, visibility 1s ease;
            cursor: pointer;
        }

        #welcome-screen img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }

        /* Contenedor principal estilo tarjeta móvil centrada */
        .invitation-wrapper {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background-color: #f9f6f0;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.15);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #main-content {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-img {
            width: 100%;
            background-color: #f9f6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 0;
            font-size: 0;
        }

        .section-img img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Animación de entrada con zoom elegante */
        .animate-zoom {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1.2s ease-out, transform 1.2s ease-out;
        }

        .animate-zoom.active {
            opacity: 1;
            transform: scale(1);
        }

        /* Animación especial flotante/deslizante para vestimenta y regalos */
        .animate-float {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1.2s ease-out, transform 1.2s ease-out;
        }

        .animate-float.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Animación padrisima especial (Flip 3D con destello) para la sección de Asistencia */
        .animate-flip-special {
            opacity: 0;
            transform: perspective(1000px) rotateX(25deg) scale(0.85);
            filter: brightness(1.2);
            transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1), transform 1.4s cubic-bezier(0.16, 1, 0.3, 1), filter 1.4s ease;
        }

        .animate-flip-special.active {
            opacity: 1;
            transform: perspective(1000px) rotateX(0deg) scale(1);
            filter: brightness(1);
        }

        /* Sección de la cuenta regresiva en fondo blanco */
        .countdown-section {
            width: 100%;
            padding: 40px 20px 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
        }

        .countdown {
            display: flex;
            gap: 35px;
            align-items: flex-end;
            justify-content: center;
        }

        .block {
            text-align: center;
            position: relative;
        }

        .number {
            font-size: 50px;
            color: #BB9885;
            line-height: 1;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(187, 152, 133, 0.25);
        }

        .block::after {
            content: "";
            display: block;
            width: 32px;
            height: 1px;
            background: rgba(187, 152, 133, 0.4);
            margin: 8px auto 6px;
        }

        .label {
            font-size: 11px;
            letter-spacing: 3px;
            color: #A37E6B;
        }

        /* Sección de Ceremonia y Ubicación */
        .location-section {
            width: 100%;
            background-color: #F9EEEB;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 45px 20px;
        }

        .location-section img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Sección de Recepción */
        .reception-section {
            width: 100%;
            background-color: #F9EEEB;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 45px 20px;
        }

        .reception-section img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Sección de la imagen de título de galería */
        .gallery-title-section {
            width: 100%;
            background-color: #f9f6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 0;
            font-size: 0;
        }

        .gallery-title-section img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Sección del Carrusel con altura extendida */
        .gallery-section {
            width: 100%;
            background-color: #f9f6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 0;
            font-size: 0;
            padding: 0;
            margin: 0;
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 600px; 
            overflow: hidden;
            background: #f9f6f0;
        }

        .slider-container img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        .slider-container img.active {
            opacity: 1;
        }

        /* Botón personalizado de ubicación */
        .location-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            background-color: #E5A6AC;
            color: #ffffff;
            font-family: 'SS Abigail', serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(229, 166, 172, 0.3);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .location-btn:hover {
            transform: scale(1.05);
            background-color: #d8959b;
        }

        /* Estilos integrados para el Formulario de Asistencia con fondo #F9EEEB */
        .rsvp-container-wrapper {
            width: 100%;
            background-color: #F9EEEB;
            padding: 20px 15px 40px 15px;
            display: flex;
            justify-content: center;
        }

        .rsvp-inner {
            width: 100%;
            max-width: 380px;
            margin: auto;
            color: #4a4a4a;
            font-family: 'Montserrat', sans-serif;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .rsvp-inner label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #4a4a4a;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .rsvp-inner select, 
        .rsvp-inner input[type="text"], 
        .rsvp-inner textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0ccd0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: 'Montserrat', sans-serif;
            background-color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        .rsvp-inner select:focus, 
        .rsvp-inner input[type="text"]:focus, 
        .rsvp-inner textarea:focus {
            outline: none;
            border-color: #E5A6AC;
            box-shadow: 0 0 0 3px rgba(229, 166, 172, 0.2);
        }

        .rsvp-inner textarea {
            resize: vertical;
            height: 90px;
        }

        .rsvp-inner .btn {
            background-color: #E5A6AC;
            color: #ffffff;
            padding: 14px;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-size: 15px;
            font-family: 'Cinzel', serif;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(229, 166, 172, 0.4);
            text-transform: uppercase;
        }

        .rsvp-inner .btn:hover {
            background-color: #c48b91;
        }

        .rsvp-inner .btn:active {
            transform: scale(0.98);
        }

        .btn-success {
            background-color: #E5A6AC;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(229, 166, 172, 0.4);
        }

        .btn-success:hover {
            background-color: #c48b91;
        }

        .hidden { 
            display: none !important; 
        }

        #resultado-pase { 
            text-align: center; 
        }

        #resultado-pase p {
            font-family: 'Cinzel', serif;
            color: #c48b91;
            font-size: 18px;
            margin-bottom: 15px;
        }

        #resultado-pase img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid #eee;
        }

        .mensaje-agradecimiento {
            text-align: center;
            font-size: 15px;
            color: #4a4a4a;
            line-height: 1.6;
        }

        /* Control de Música */
        #music-control {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            background-color: #ffd1dc;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            z-index: 100;
            border: 2px solid #ffffff;
            transition: transform 0.3s ease;
        }

        #music-control:hover {
            transform: scale(1.1);
        }

        #music-control svg {
            width: 24px;
            height: 24px;
            fill: #555555;
        }

        @media(max-width: 480px) {
            .invitation-wrapper {
                max-width: 100%;
                box-shadow: none;
            }
            .countdown { gap: 20px; }
            .number { font-size: 42px; }
            .label { font-size: 10px; }
            .slider-container { height: 520px; }
        }
    </style>
</head>
<body>

    <!-- Pantalla de Bienvenida -->
    <div id="welcome-screen" title="Haz clic para abrir">
        <img src="foto.jpg" alt="Sobre de invitación">
    </div>

    <!-- Contenedor general en formato tarjeta estilo celular -->
    <div class="invitation-wrapper">
        <!-- Contenido Principal -->
        <div id="main-content">
            <!-- 1. Foto de Portada -->
            <section class="section-img">
                <img src="portada.jpg" alt="Portada de la invitación de Mis 15 Años">
            </section>

            <!-- 2. Foto de Frase -->
            <section class="section-img">
                <img src="frase.jpg" alt="Frase de Mis 15 Años" class="animate-zoom">
            </section>

            <!-- 3. Foto de Fecha -->
            <section class="section-img">
                <img src="fecha.jpg" alt="Fecha de Mis 15 Años" class="animate-zoom">
            </section>

            <!-- 4. Cuenta Regresiva -->
            <section class="countdown-section">
                <div class="countdown">
                    <div class="block">
                        <div id="days" class="number">0</div>
                        <div class="label">DÍAS</div>
                    </div>
                    <div class="block">
                        <div id="hours" class="number">00</div>
                        <div class="label">HORAS</div>
                    </div>
                    <div class="block">
                        <div id="minutes" class="number">00</div>
                        <div class="label">MINUTOS</div>
                    </div>
                    <div class="block">
                        <div id="seconds" class="number">00</div>
                        <div class="label">SEGUNDOS</div>
                    </div>
                </div>
            </section>

            <!-- 5. Foto de Ceremonia y Ubicación -->
            <section class="location-section">
                <img src="ceremonia.jpg" alt="Detalles de ceremonia" class="animate-zoom">
                <a href="https://www.google.com/maps/place/Parroquia+del+Sagrado+Coraz%C3%B3n+de+Jes%C3%BAs/@28.6262123,-106.0734464,859m/data=!3m2!1e3!4b1!4m6!3m5!1s0x86ea5caebcfb39a9:0x7142c0ef10e82b9b!8m2!3d28.6262123!4d-106.0711241!16s%2Fg%2F1tgdcw5w!18m1!1e1?entry=ttu&g_ep=EgoyMDI2MDcyOS4wIKXMDSoASAFQAw%3D%3D" target="_blank" class="location-btn">VER UBICACIÓN</a>
            </section>

            <!-- 6. Foto de Recepción y Ubicación -->
            <section class="reception-section">
                <img src="recepcion.jpg" alt="Detalles de recepción" class="animate-zoom">
                <a href="https://www.google.com/maps/place/Quinta+kiri,+C.+Guadalupe+Posadas,+11+de+Febrero+Sur,+31066+Chihuahua,+Chih./data=!4m2!3m1!1s0x86ea5bac27293f75:0x64a47b49dd5ce364!18m1!1e1?utm_source=mstt_1&entry=gps&coh=192189&g_ep=CAESBzI2LjI5LjIYACCenQoqnwEsOTQyNjc3MjcsOTQyOTIxOTUsOTQyOTk1MzIsMTAwNzk2NDk4LDEwMDc5Nzc2MSwxMDA3OTY1MzUsOTQyODA1NzYsOTQyMDczOTQsOTQyMDc1MDYsOTQyMDg1MDYsOTQyMTg2NTMsOTQyMjk4MzksOTQyNzUxNjgsOTQyNzk2MTksMTAwODE1NjM1LDEwMDgyMDIzNywxMDA4MjI0ODlCAk1Y&skid=04858c28-c6d2-4605-bc97-a16742ce76be&g_st=aw" target="_blank" class="location-btn">VER UBICACIÓN</a>
            </section>

            <!-- 7. Foto Título de Galería -->
            <section class="gallery-title-section">
                <img src="galeria.jpg" alt="Galería de Mis 15 Años" class="animate-zoom">
            </section>

            <!-- 8. Carrusel de Fotos -->
            <section class="gallery-section">
                <div class="slider-container animate-zoom">
                    <img src="https://i.imgur.com/MSYBfYT.jpeg" class="active" alt="Foto 1">
                    <img src="https://i.imgur.com/OwS4Q50.png" alt="Foto 2">
                    <img src="https://i.imgur.com/L67IlOh.jpeg" alt="Foto 3">
                </div>
            </section>

            <!-- 9. Foto de Vestimenta -->
            <section class="section-img">
                <img src="vestimenta.jpg" alt="Código de vestimenta" class="animate-float">
            </section>

            <!-- 10. Foto de Regalo -->
            <section class="section-img">
                <img src="regalo.jpg" alt="Sugerencia de regalo" class="animate-float">
            </section>

            <!-- 11. Foto de Asistencia con Animación y Formulario Integrado con Fondo #F9EEEB -->
            <section class="section-img" style="flex-direction: column;">
                <img src="asistencia.jpg" alt="Confirmar asistencia" class="animate-flip-special" style="margin-bottom: 0;">
                
                <div class="rsvp-container-wrapper animate-flip-special">
                    <div class="rsvp-inner">
                        <form id="asistenciaForm">
                            <div class="form-group">
                                <label for="asistentes">¿Cuántas personas asistirán?</label>
                                <select id="asistentes" name="asistentes" required onchange="cambiarOpciones()">
                                    <option value="" disabled selected>Selecciona una opción</option>
                                    <option value="1">1 Asistente</option>
                                    <option value="2">2 Asistentes</option>
                                    <option value="0">No podremos asistir</option>
                                </select>
                            </div>

                            <div id="seccion-1" class="hidden">
                                <div class="form-group">
                                    <label for="nombre1">Nombre completo:</label>
                                    <input type="text" id="nombre1" name="nombre1" placeholder="Tu nombre y apellido">
                                </div>
                            </div>

                            <div id="seccion-2" class="hidden">
                                <div class="form-group">
                                    <label for="nombre_a">Nombre del Asistente 1:</label>
                                    <input type="text" id="nombre_a" name="nombre_a" placeholder="Nombre completo">
                                </div>
                                <div class="form-group">
                                    <label for="nombre_b">Nombre del Asistente 2:</label>
                                    <input type="text" id="nombre_b" name="nombre_b" placeholder="Nombre completo">
                                </div>
                            </div>

                            <div id="seccion-mensaje" class="hidden">
                                <div class="form-group">
                                    <label for="mensaje">Mensaje o felicitación (Opcional):</label>
                                    <textarea id="mensaje" name="mensaje" placeholder="Escribe unas palabras para la festejada..."></textarea>
                                </div>
                                <button type="submit" class="btn">Confirmar Asistencia</button>
                            </div>

                            <div id="seccion-no-asisten" class="hidden">
                                <p class="mensaje-agradecimiento" style="margin-bottom: 20px;">Lamentamos que no nos puedan acompañar, ¡gracias por avisarnos!</p>
                                <button type="submit" class="btn">Enviar Respuesta</button>
                            </div>
                        </form>

                        <div id="resultado-pase" class="hidden">
                            <p>¡Asistencia Confirmada!</p>
                            <p style="font-size: 13px; font-family: 'Montserrat', sans-serif; color: #777; margin-top: -10px; margin-bottom: 15px;">Guarda tu pase digital en tu celular:</p>
                            <img id="imgPase" src="" alt="Pase de acceso">
                            <a id="btnDescargar" class="btn btn-success" download>Descargar Pase</a>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Reproductor de Audio -->
    <audio id="bg-music" loop>
        <source src="cancion.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <!-- Botón flotante de música -->
    <div id="music-control" class="hidden" title="Reproducir / Pausar música">
        <svg id="icon-speaker" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <svg id="icon-pause" viewBox="0 0 24 24" style="display: none;">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
    </div>

    <script>
        const welcomeScreen = document.getElementById('welcome-screen');
        const mainContent = document.getElementById('main-content');
        const bgMusic = document.getElementById('bg-music');
        const musicControl = document.getElementById('music-control');
        const iconSpeaker = document.getElementById('icon-speaker');
        const iconPause = document.getElementById('icon-pause');

        let isPlaying = false;

        welcomeScreen.addEventListener('click', () => {
            welcomeScreen.style.opacity = '0';
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
            }, 1000);

            mainContent.style.visibility = 'visible';
            mainContent.style.opacity = '1';
            musicControl.classList.remove('hidden');

            bgMusic.play().then(() => {
                isPlaying = true;
                updateMusicIcon();
            }).catch(error => {
                console.log("Reproducción automática bloqueada por el navegador:", error);
            });
        });

        musicControl.addEventListener('click', () => {
            if (isPlaying) {
                bgMusic.pause();
                isPlaying = false;
            } else {
                bgMusic.play();
                isPlaying = true;
            }
            updateMusicIcon();
        });

        function updateMusicIcon() {
            if (isPlaying) {
                iconSpeaker.style.display = 'none';
                iconPause.style.display = 'block';
            } else {
                iconSpeaker.style.display = 'block';
                iconPause.style.display = 'none';
            }
        }

        /* Animación de entrada al hacer scroll */
        const observerOptions = {
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.animate-zoom, .animate-float, .animate-flip-special').forEach(el => {
            observer.observe(el);
        });

        /* Script del Carrusel de Fotos */
        const sliderImages = document.querySelectorAll('.slider-container img');
        let currentSlide = 0;

        setInterval(() => {
            sliderImages[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % sliderImages.length;
            sliderImages[currentSlide].classList.add('active');
        }, 3000);

        /* Cuenta Regresiva actualizada al 22 de Agosto de 2026 a las 3:00 PM (15:00 hrs) */
        const DATE_TARGET = new Date(2026, 7, 22, 15, 0, 0);

        const days = document.getElementById('days');
        const hours = document.getElementById('hours');
        const minutes = document.getElementById('minutes');
        const seconds = document.getElementById('seconds');

        const MS = 1000;
        const MIN = MS * 60;
        const H = MIN * 60;
        const D = H * 24;

        function format(n){
            return n < 10 ? '0' + n : n;
        }

        (function updateCountdown(){
            const now = new Date();
            let dur = DATE_TARGET - now;

            if(dur < 0) dur = 0;

            days.textContent = Math.floor(dur / D);
            hours.textContent = format(Math.floor((dur % D) / H));
            minutes.textContent = format(Math.floor((dur % H) / MIN));
            seconds.textContent = format(Math.floor((dur % MIN) / MS));

            setTimeout(updateCountdown, 1000);
        })();

        /* Script de Envío del Formulario RSVP y Pases Dinámicos */
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz5-SvzwGrIXS4B_tlXUhS8gfoRIIgEHQaseXsXvPtEbm2EMTB-37Vhpw_xrxZbnMY/exec';

        function cambiarOpciones() {
            const valor = document.getElementById('asistentes').value;
            document.getElementById('seccion-1').classList.toggle('hidden', valor !== '1');
            document.getElementById('seccion-2').classList.toggle('hidden', valor !== '2');
            document.getElementById('seccion-mensaje').classList.toggle('hidden', valor === '0' || valor === '');
            document.getElementById('seccion-no-asisten').classList.toggle('hidden', valor !== '0');
        }

        document.getElementById('asistenciaForm').addEventListener('submit', e => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const tipo = formData.get('asistentes');

            // Enviamos los datos en segundo plano
            fetch(scriptURL, { method: 'POST', body: formData }).catch(error => console.error('Error:', error));

            // Mostramos la pantalla de éxito inmediatamente
            document.getElementById('asistenciaForm').classList.add('hidden');
            
            if (tipo !== '0') {
                const img = document.getElementById('imgPase');
                const btn = document.getElementById('btnDescargar');
                
                let archivoImagen = (tipo === '1') ? 'pase.jpg' : 'pases.jpg';
                
                img.src = archivoImagen;
                btn.href = archivoImagen;
                btn.setAttribute('download', archivoImagen);
                
                document.getElementById('resultado-pase').classList.remove('hidden');
            } else {
                alert("Gracias por avisarnos.");
                location.reload();
            }
        });
    </script>
</body>
</html>
