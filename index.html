<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis 15 Años</title>

    <meta property="og:title" content="Mis 15 Años">
    <meta property="og:description" content="Te invito a celebrar este momento tan especial conmigo. Haz click para abrir tu invitación.">
    <meta property="og:image" content="portada.jpg">
    <meta property="og:url" content="">
    <meta property="og:type" content="https://invitaendigitalweb-svg.github.io/xvbrithany">

    <link rel="preconnect" href="https://fonts.cdnfonts.com">
    <link href="https://fonts.cdnfonts.com/css/ss-abigail" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #e8e2d8;
            font-family: 'SS Abigail', serif;
        }

        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f9f6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1s ease, visibility 1s ease;
            cursor: pointer;
        }

        #welcome-screen img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }

        .invitation-wrapper {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background-color: #f9f6f0;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.15);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #main-content {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-img {
            width: 100%;
            background-color: #f9f6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 0;
            font-size: 0;
        }

        .section-img img {
            width: 100%;
            height: auto;
            display: block;
        }

        .animate-zoom {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1.2s ease-out, transform 1.2s ease-out;
        }

        .animate-zoom.active {
            opacity: 1;
            transform: scale(1);
        }

        .animate-float {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1.2s ease-out, transform 1.2s ease-out;
        }

        .animate-float.active {
            opacity: 1;
            transform: translateY(0);
        }

        .animate-flip-special {
            opacity: 0;
            transform: perspective(1000px) rotateX(25deg) scale(0.85);
            filter: brightness(1.2);
            transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1), transform 1.4s cubic-bezier(0.16, 1, 0.3, 1), filter 1.4s ease;
        }

        .animate-flip-special.active {
            opacity: 1;
            transform: perspective(1000px) rotateX(0deg) scale(1);
            filter: brightness(1);
        }

        .countdown-section {
            width: 100%;
            padding: 40px 20px 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
        }

        .countdown {
            display: flex;
            gap: 35px;
            align-items: flex-end;
            justify-content: center;
        }

        .block {
            text-align: center;
            position: relative;
        }

        .number {
            font-size: 50px;
            color: #BB9885;
            line-height: 1;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(187, 152, 133, 0.25);
        }

        .block::after {
            content: "";
            display: block;
            width: 32px;
            height: 1px;
            background: rgba(187, 152, 133, 0.4);
            margin: 8px auto 6px;
        }

        .label {
            font-size: 11px;
            letter-spacing: 3px;
            color: #A37E6B;
        }

        .location-section, .reception-section {
            width: 100%;
            background-color: #F9EEEB;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 45px 20px;
        }

        .location-section img, .reception-section img {
            width: 100%;
            height: auto;
            display: block;
        }

        .gallery-title-section {
            width: 100%;
            background-color: #f9f6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 0;
            font-size: 0;
        }

        .gallery-title-section img {
            width: 100%;
            height: auto;
            display: block;
        }

        .gallery-section {
            width: 100%;
            background-color: #f9f6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 0;
            font-size: 0;
            padding: 0;
            margin: 0;
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 600px; 
            overflow: hidden;
            background: #f9f6f0;
        }

        .slider-container img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        .slider-container img.active {
            opacity: 1;
        }

        .location-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            background-color: #E5A6AC;
            color: #ffffff;
            font-family: 'SS Abigail', serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(229, 166, 172, 0.3);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .location-btn:hover {
            transform: scale(1.05);
            background-color: #d8959b;
        }

        #rsvp-section-wrapper {
            width: 100%;
            background-color: #f9f6f0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .container-rsvp {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            color: #333333;
        }

        .container-rsvp h2 {
            margin-bottom: 20px;
            color: #BB9885;
            font-family: 'SS Abigail', serif;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .container-rsvp .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .container-rsvp label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 13px;
            color: #555555;
        }

        .container-rsvp input[type="text"], 
        .container-rsvp textarea, 
        .container-rsvp select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            background-color: #faf9f6;
        }

        .container-rsvp textarea {
            resize: vertical;
            height: 75px;
        }

        .btn-rsvp {
            background-color: #E5A6AC;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            font-family: 'SS Abigail', serif;
            font-weight: 700;
            letter-spacing: 1px;
            transition: background 0.3s;
        }

        .btn-rsvp:hover {
            background-color: #d8959b;
        }

        .pass-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            margin-bottom: 15px;
            text-align: center;
        }

        .pass-container img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        /* Posición baja, debajo de la fecha, en mayúsculas y bien legible */
        #nombre-pase-overlay {
            position: absolute;
            top: 89%;
            left: 8%;
            transform: translateY(-50%);
            width: 84%;
            font-family: 'SS Abigail', serif;
            font-size: 15px;
            color: #8C6A5A;
            font-weight: bold;
            letter-spacing: 1px;
            text-align: left;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(255,255,255,0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: uppercase;
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            display: none !important;
        }

        #music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background-color: #E5A6AC;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            z-index: 999;
            transition: transform 0.3s ease;
        }

        #music-control:hover {
            transform: scale(1.1);
        }

        #music-control svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        @media(max-width: 480px) {
            .invitation-wrapper {
                max-width: 100%;
                box-shadow: none;
            }
            .countdown { gap: 20px; }
            .number { font-size: 42px; }
            .label { font-size: 10px; }
            .slider-container { height: 520px; }
            #nombre-pase-overlay { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div id="welcome-screen" title="Haz clic para abrir">
        <img src="foto.jpg" alt="Sobre de invitación">
    </div>

    <div class="invitation-wrapper">
        <div id="main-content">
            <section class="section-img">
                <img src="portada.jpg" alt="Portada de la invitación de Mis 15 Años">
            </section>

            <section class="section-img">
                <img src="frase.jpg" alt="Frase de Mis 15 Años" class="animate-zoom">
            </section>

            <section class="section-img">
                <img src="fecha.jpg" alt="Fecha de Mis 15 Años" class="animate-zoom">
            </section>

            <section class="countdown-section">
                <div class="countdown">
                    <div class="block">
                        <div id="days" class="number">0</div>
                        <div class="label">DÍAS</div>
                    </div>
                    <div class="block">
                        <div id="hours" class="number">00</div>
                        <div class="label">HORAS</div>
                    </div>
                    <div class="block">
                        <div id="minutes" class="number">00</div>
                        <div class="label">MINUTOS</div>
                    </div>
                    <div class="block">
                        <div id="seconds" class="number">00</div>
                        <div class="label">SEGUNDOS</div>
                    </div>
                </div>
            </section>

            <section class="location-section">
                <img src="ceremonia.jpg" alt="Detalles de ceremonia" class="animate-zoom">
                <a href="https://www.google.com/maps/place/Parroquia+del+Sagrado+Coraz%C3%B3n+de+Jes%C3%BAs/@28.6262123,-106.0734464,859m/data=!3m2!1e3!4b1!4m6!3m5!1s0x86ea5caebcfb39a9:0x7142c0ef10e82b9b!8m2!3d28.6262123!4d-106.0711241!16s%2Fg%2F1tgdcw5w!18m1!1e1?entry=ttu" target="_blank" class="location-btn">VER UBICACIÓN</a>
            </section>

            <section class="reception-section">
                <img src="recepcion.jpg" alt="Detalles de recepción" class="animate-zoom">
                <a href="https://www.google.com/maps/place/Quinta+kiri,+C.+Guadalupe+Posadas,+11+de+Febrero+Sur,+31066+Chihuahua,+Chih./data=!4m2!3m1!1s0x86ea5bac27293f75:0x64a47b49dd5ce364!18m1!1e1" target="_blank" class="location-btn">VER UBICACIÓN</a>
            </section>

            <section class="gallery-title-section">
                <img src="galeria.jpg" alt="Galería de Mis 15 Años" class="animate-zoom">
            </section>

            <section class="gallery-section">
                <div class="slider-container animate-zoom">
                    <img src="https://i.imgur.com/MSYBfYT.jpeg" class="active" alt="Foto 1">
                    <img src="https://i.imgur.com/OwS4Q50.png" alt="Foto 2">
                    <img src="https://i.imgur.com/L67IlOh.jpeg" alt="Foto 3">
                </div>
            </section>

            <section class="section-img">
                <img src="vestimenta.jpg" alt="Código de vestimenta" class="animate-float">
            </section>

            <section class="section-img">
                <img src="regalo.jpg" alt="Sugerencia de regalo" class="animate-float">
            </section>

            <section class="section-img" style="flex-direction: column;">
                <img src="asistencia.jpg" alt="Confirmar asistencia" class="animate-flip-special" style="margin-bottom: 0;">
            </section>

            <div id="rsvp-section-wrapper" class="animate-flip-special">
                <div class="container-rsvp">
                    <form id="rsvp-form">
                        <h2>Confirmación de Asistencia</h2>
                        
                        <div class="form-group">
                            <label for="nombre">Nombre y 2 Apellidos (Forzoso) *</label>
                            <input type="text" id="nombre" name="nombre" required placeholder="Ej. Fernanda López Cruz">
                            <small id="error-nombre" style="color: #d9534f; font-size: 11px; display: none; margin-top: 4px;">Debes ingresar obligatoriamente tu nombre y tus dos apellidos.</small>
                        </div>

                        <div class="form-group">
                            <label for="asistencia">¿Asistirás? *</label>
                            <select id="asistencia" name="asistencia" required>
                                <option value="" disabled selected>Selecciona una opción</option>
                                <option value="Sí asisto">Sí, ahí estaré</option>
                                <option value="No asisto">No podré asistir</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="mensaje">Mensaje o felicitación</label>
                            <textarea id="mensaje" name="mensaje" placeholder="Escribe unas palabras..."></textarea>
                        </div>

                        <button type="submit" id="btn-enviar" class="btn-rsvp">Enviar Confirmación</button>
                    </form>

                    <div id="success-screen" class="hidden">
                        <h2 id="success-title">¡Gracias por confirmar!</h2>
                        <p id="success-message" style="font-size: 13px; margin-bottom: 15px; line-height: 1.4;">Tu respuesta ha sido registrada con éxito.</p>
                        
                        <div class="pass-container" id="pass-section">
                            <p style="font-size: 13px; margin-bottom: 8px;"><strong>Tu Pase de Entrada:</strong></p>
                            <!-- Contenedor visual del pase -->
                            <div id="captura-pase" style="position: relative; display: inline-block; width: 100%;">
                                <img src="pase.jpg" alt="Pase de Invitación" id="pase-img">
                                <div id="nombre-pase-overlay"></div>
                            </div>
                            <button id="btn-descargar" class="btn-rsvp" style="margin-top: 15px; margin-bottom: 10px;">Descargar Pase</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="cancion.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <div id="music-control" class="hidden" title="Reproducir / Pausar música">
        <svg id="icon-speaker" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <svg id="icon-pause" viewBox="0 0 24 24" style="display: none;">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
    </div>

    <script>
        const welcomeScreen = document.getElementById('welcome-screen');
        const mainContent = document.getElementById('main-content');
        const bgMusic = document.getElementById('bg-music');
        const musicControl = document.getElementById('music-control');
        const iconSpeaker = document.getElementById('icon-speaker');
        const iconPause = document.getElementById('icon-pause');

        let isPlaying = false;

        welcomeScreen.addEventListener('click', () => {
            welcomeScreen.style.opacity = '0';
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
            }, 1000);

            mainContent.style.visibility = 'visible';
            mainContent.style.opacity = '1';
            musicControl.classList.remove('hidden');

            bgMusic.play().then(() => {
                isPlaying = true;
                updateMusicIcon();
            }).catch(error => {
                console.log("Reproducción automática bloqueada:", error);
            });
        });

        musicControl.addEventListener('click', () => {
            if (isPlaying) {
                bgMusic.pause();
                isPlaying = false;
            } else {
                bgMusic.play();
                isPlaying = true;
            }
            updateMusicIcon();
        });

        function updateMusicIcon() {
            if (isPlaying) {
                iconSpeaker.style.display = 'none';
                iconPause.style.display = 'block';
            } else {
                iconSpeaker.style.display = 'block';
                iconPause.style.display = 'none';
            }
        }

        const observerOptions = { threshold: 0.1 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.animate-zoom, .animate-float, .animate-flip-special').forEach(el => {
            observer.observe(el);
        });

        const sliderImages = document.querySelectorAll('.slider-container img');
        let currentSlide = 0;

        setInterval(() => {
            sliderImages[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % sliderImages.length;
            sliderImages[currentSlide].classList.add('active');
        }, 3000);

        const DATE_TARGET = new Date(2026, 7, 22, 15, 0, 0);
        const days = document.getElementById('days');
        const hours = document.getElementById('hours');
        const minutes = document.getElementById('minutes');
        const seconds = document.getElementById('seconds');

        const MS = 1000, MIN = MS * 60, H = MIN * 60, D = H * 24;
        function format(n){ return n < 10 ? '0' + n : n; }

        (function updateCountdown(){
            const now = new Date();
            let dur = DATE_TARGET - now;
            if(dur < 0) dur = 0;
            days.textContent = Math.floor(dur / D);
            hours.textContent = format(Math.floor((dur % D) / H));
            minutes.textContent = format(Math.floor((dur % H) / MIN));
            seconds.textContent = format(Math.floor((dur % MIN) / MS));
            setTimeout(updateCountdown, 1000);
        })();

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzC--gpPAlnUk43sHlPzqOsLNJ0P1i3Z_z8swBJvXZC3tjdrxuP5svy6XFwDEevFsMS/exec';

        const rsvpForm = document.getElementById('rsvp-form');
        const successScreen = document.getElementById('success-screen');
        const successTitle = document.getElementById('success-title');
        const successMessage = document.getElementById('success-message');
        const passSection = document.getElementById('pass-section');
        const btnDescargar = document.getElementById('btn-descargar');
        const inputNombre = document.getElementById('nombre');
        const errorNombre = document.getElementById('error-nombre');
        const nombrePaseOverlay = document.getElementById('nombre-pase-overlay');

        function validarNombreCompleto(texto) {
            const palabras = texto.trim().split(/\s+/);
            return palabras.length >= 3;
        }

        rsvpForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nombre = inputNombre.value.trim();
            
            if (!validarNombreCompleto(nombre)) {
                errorNombre.style.display = 'block';
                inputNombre.focus();
                return;
            } else {
                errorNombre.style.display = 'none';
            }

            const btnEnviar = document.getElementById('btn-enviar');
            btnEnviar.disabled = true;
            btnEnviar.textContent = 'Verificando registro...';

            const asistencia = document.getElementById('asistencia').value;
            const mensaje = document.getElementById('mensaje').value.trim();

            const datos = {
                nombre: nombre,
                asistencia: asistencia,
                mensaje: mensaje
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(datos)
                });
                const result = await response.json();

                if (result.status === 'success' || result.status === 'duplicado' || result.status === 'actualizado') {
                    const statusFinal = result.asistencia || asistencia;
                    mostrarPantallaExito({ 
                        nombre: nombre, 
                        asistencia: statusFinal, 
                        isDuplicado: result.status === 'duplicado',
                        isActualizado: result.status === 'actualizado'
                    });
                } else {
                    alert('Hubo un error al registrar. Inténtalo de nuevo.');
                    btnEnviar.disabled = false;
                    btnEnviar.textContent = 'Enviar Confirmación';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión con el servidor.');
                btnEnviar.disabled = false;
                btnEnviar.textContent = 'Enviar respuesta';
            }
        });

        function mostrarPantallaExito(data) {
            rsvpForm.classList.add('hidden');
            successScreen.classList.remove('hidden');

            nombrePaseOverlay.textContent = data.nombre.toUpperCase();

            if (data.asistencia === 'No asisto') {
                if (data.isActualizado) {
                    successTitle.textContent = '¡Respuesta actualizada!';
                    successMessage.textContent = `${data.nombre}, hemos actualizado tu registro. Ahora has indicado que no podrás asistir.`;
                } else if (data.isDuplicado) {
                    successTitle.textContent = '¡Ya habías registrado tu respuesta!';
                    successMessage.textContent = `${data.nombre}, detectamos que ya habías confirmado previamente que no podrás asistir. ¡Agradecemos tus buenos deseos!`;
                } else {
                    successTitle.textContent = 'Gracias por avisarnos';
                    successMessage.textContent = `${data.nombre}, hemos registrado que lamentablemente no nos acompañarás. ¡Gracias por tus buenos deseos!`;
                }
                passSection.classList.add('hidden');
            } else {
                if (data.isActualizado) {
                    successTitle.textContent = '¡Respuesta actualizada!';
                    successMessage.textContent = `${data.nombre}, hemos actualizado tu registro. ¡Ahora sí estás confirmado(a)! Aquí tienes tu pase:`;
                } else if (data.isDuplicado) {
                    successTitle.textContent = '¡Ya estás registrado(a)!';
                    successMessage.textContent = `${data.nombre}, detectamos que ya habías confirmado tu asistencia con anterioridad. ¡Aquí tienes tu pase de entrada!:`;
                } else {
                    successTitle.textContent = '¡Ya estás confirmado(a)!';
                    successMessage.textContent = `${data.nombre}, tu registro ha sido validado correctamente.`;
                }
                passSection.classList.remove('hidden');
            }
        }

        // Descarga optimizada utilizando Canvas Nativo HTML5
        btnDescargar.addEventListener('click', () => {
            btnDescargar.disabled = true;
            btnDescargar.textContent = 'Generando pase...';

            const imgPase = document.getElementById('pase-img');
            const nombreText = document.getElementById('nombre-pase-overlay').textContent;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = imgPase.naturalWidth;
            canvas.height = imgPase.naturalHeight;

            // 1. Dibujar imagen base
            ctx.drawImage(imgPase, 0, 0, canvas.width, canvas.height);

            // 2. Estilos tipográficos proporcionales
            const fontSize = canvas.width * 0.045;
            ctx.font = `bold ${fontSize}px 'SS Abigail', serif`;
            ctx.fillStyle = '#8C6A5A';
            ctx.textBaseline = 'middle';

            // Sombra para mejor lectura
            ctx.shadowColor = 'rgba(255,255,255,0.9)';
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 2;
            ctx.shadowBlur = 4;

            // 3. Posicionamiento dinámico (89% top, 8% left)
            const posX = canvas.width * 0.08;
            const posY = canvas.height * 0.89;

            // 4. Pintar texto en mayúsculas
            ctx.fillText(nombreText.toUpperCase(), posX, posY);

            try {
                canvas.toBlob((blob) => {
                    if (!blob) throw new Error("No se pudo crear la imagen");

                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Pase_${nombreText.replace(/\s+/g, '_')}.jpg`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);

                    btnDescargar.disabled = false;
                    btnDescargar.textContent = 'Descargar Pase';
                }, 'image/jpeg', 0.95);
                
            } catch (error) {
                console.error("Bloqueo de seguridad local CORS:", error);
                alert("⚠️ NAVEGADOR BLOQUEÓ LA DESCARGA LOCAL\n\nEstás abriendo la página directamente con doble clic (file:///...). Usa 'Live Server' en VS Code o súbelo a internet para probar la descarga.");
                btnDescargar.disabled = false;
                btnDescargar.textContent = 'Descargar Pase';
            }
        });
    </script>
</body>
</html>
