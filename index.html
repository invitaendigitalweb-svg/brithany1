<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis 15 Años</title>

    <!-- Etiquetas Open Graph para la miniatura de WhatsApp -->
    <meta property="og:title" content="Mis 15 Años">
    <meta property="og:description" content="Te invito a celebrar este momento tan especial conmigo. Haz click para abrir tu invitación.">
    <meta property="og:image" content="portada.jpg">
    <meta property="og:url" content="">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.cdnfonts.com">
    <link href="https://fonts.cdnfonts.com/css/ss-abigail" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* ... TUS ESTILOS ANTERIORES SE MANTIENEN IGUAL ... */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow-x: hidden; background-color: #e8e2d8; font-family: 'SS Abigail', serif; }
        #welcome-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #f9f6f0; display: flex; justify-content: center; align-items: center; z-index: 10; transition: opacity 1s ease, visibility 1s ease; cursor: pointer; }
        #welcome-screen img { width: 100%; height: 100%; object-fit: contain; }
        .invitation-wrapper { width: 100%; max-width: 480px; margin: 0 auto; background-color: #f9f6f0; box-shadow: 0 0 25px rgba(0, 0, 0, 0.15); min-height: 100vh; display: flex; flex-direction: column; }
        #main-content { opacity: 0; visibility: hidden; transition: opacity 1.5s ease; width: 100%; display: flex; flex-direction: column; align-items: center; }
        
        /* NUEVO CÓDIGO DE CONFIRMACIÓN (CSS) */
        .rsvp-wrapper { font-family: 'Cinzel', serif; background-color: #ffffff; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 450px; box-sizing: border-box; text-align: center; margin: 40px auto; }
        .rsvp-wrapper h2 { margin-bottom: 20px; color: #E07C8A; font-weight: 700; }
        .rsvp-wrapper .form-group { margin-bottom: 20px; text-align: left; }
        .rsvp-wrapper label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #333; }
        .rsvp-wrapper input[type="text"], .rsvp-wrapper textarea, .rsvp-wrapper select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 14px; }
        .rsvp-wrapper textarea { resize: vertical; height: 80px; }
        .rsvp-wrapper button { background-color: #E07C8A; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; font-family: inherit; font-weight: 700; transition: background 0.3s; }
        .rsvp-wrapper button:hover { background-color: #c96b77; }
        .rsvp-wrapper .hidden { display: none !important; }
        .rsvp-wrapper .pass-container img { max-width: 100%; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .rsvp-wrapper .loader { border: 4px solid #f3f3f3; border-top: 4px solid #E07C8A; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="welcome-screen" title="Haz clic para abrir">
        <img src="foto.jpg" alt="Sobre de invitación">
    </div>

    <div class="invitation-wrapper">
        <div id="main-content">
            <!-- (Aquí irían tus secciones previas de imágenes, cuenta regresiva, etc.) -->

            <!-- SECCIÓN DE CONFIRMACIÓN INTEGRADA -->
            <div class="rsvp-wrapper" id="seccion-asistencia">
                <div id="loading-screen">
                    <div class="loader"></div>
                    <p>Verificando estado de invitación...</p>
                </div>

                <form id="rsvp-form" class="hidden">
                    <h2>Confirmación de Asistencia</h2>
                    <div class="form-group">
                        <label for="nombre">Nombre y Apellido *</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Ej. Ana García">
                    </div>
                    <div class="form-group">
                        <label for="asistencia">¿Asistirás? *</label>
                        <select id="asistencia" name="asistencia" required>
                            <option value="" disabled selected>Selecciona una opción</option>
                            <option value="Sí asisto">Sí, ahí estaré</option>
                            <option value="No asisto">No podré asistir</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="mensaje">Mensaje o felicitación</label>
                        <textarea id="mensaje" name="mensaje" placeholder="Escribe unas palabras..."></textarea>
                    </div>
                    <button type="submit" id="btn-enviar">Enviar Confirmación</button>
                </form>

                <div id="success-screen" class="hidden">
                    <h2 id="success-title">¡Gracias por confirmar!</h2>
                    <p id="success-message">Tu respuesta ha sido registrada con éxito.</p>
                    <div class="pass-container hidden" id="pass-section">
                        <p><strong>Tu Pase de Entrada:</strong></p>
                        <img src="pase.jpg" alt="Pase de Invitación" id="pase-img">
                        <button id="btn-descargar" style="margin-top: 10px;">Descargar Pase</button>
                    </div>
                </div>
            </div>
            <!-- FIN DE SECCIÓN -->
        </div>
    </div>

    <script>
        /* ... (Tu código anterior de música, scroll, carrusel, etc.) ... */

        /* LÓGICA DE LA NUEVA SECCIÓN DE CONFIRMACIÓN */
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzAD6APRnPDjWOfTkBr7m9JMZ8pfRzeCt_stFe3YpwlAaSXBdum26ztAQRLo1tkDAae/exec';
        const loadingScreen = document.getElementById('loading-screen');
        const rsvpForm = document.getElementById('rsvp-form');
        const successScreen = document.getElementById('success-screen');
        const successTitle = document.getElementById('success-title');
        const successMessage = document.getElementById('success-message');
        const passSection = document.getElementById('pass-section');
        const btnDescargar = document.getElementById('btn-descargar');

        window.addEventListener('DOMContentLoaded', () => {
            // Si quieres que el usuario pueda confirmar varias veces, puedes comentar la línea siguiente:
            const localConfirmed = localStorage.getItem('invitacion_confirmada');
            if (localConfirmed) {
                mostrarResultado(JSON.parse(localConfirmed));
            } else {
                loadingScreen.classList.add('hidden');
                rsvpForm.classList.remove('hidden');
            }
        });

        rsvpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombreInput = document.getElementById('nombre').value.trim();
            const palabrasNombre = nombreInput.split(/\s+/);
            if (palabrasNombre.length < 2) { alert("Por favor, ingresa tu nombre y al menos un apellido."); return; }

            const btnEnviar = document.getElementById('btn-enviar');
            btnEnviar.disabled = true;
            btnEnviar.textContent = 'Procesando...';

            const datos = { 
                nombre: nombreInput, 
                asistencia: document.getElementById('asistencia').value, 
                mensaje: document.getElementById('mensaje').value.trim() 
            };

            try {
                const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(datos) });
                const result = await response.json();
                const userData = { nombre: nombreInput, asistencia: datos.asistencia };
                localStorage.setItem('invitacion_confirmada', JSON.stringify(userData));
                mostrarResultado(userData);
            } catch (error) {
                const userData = { nombre: nombreInput, asistencia: datos.asistencia };
                localStorage.setItem('invitacion_confirmada', JSON.stringify(userData));
                mostrarResultado(userData);
            }
        });

        function mostrarResultado(data) {
            loadingScreen.classList.add('hidden');
            rsvpForm.classList.add('hidden');
            successScreen.classList.remove('hidden');
            if (data.asistencia === 'No asisto') {
                successTitle.textContent = 'Gracias por avisarnos';
                successMessage.textContent = `Lamentamos que no puedas acompañarnos, ${data.nombre}.`;
                passSection.classList.add('hidden');
            } else {
                successTitle.textContent = '¡Ya recibimos tu respuesta!';
                successMessage.textContent = `Tu asistencia está confirmada, ${data.nombre}.`;
                passSection.classList.remove('hidden');
            }
        }

        btnDescargar.addEventListener('click', () => {
            const a = document.createElement('a'); a.href = 'pase.jpg'; a.download = 'pase_invitacion.jpg';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        });
    </script>
</body>
</html>
